name: Release

# A tag like v1.2.3 cross-compiles the CLI (client/exit) for every supported
# platform and publishes it as a GitHub release with SHA256SUMS.txt.
# "Run workflow" builds the same binaries as artifacts without publishing,
# for a dry run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release (tag the built commit as v<version>)'
        type: boolean
        default: false
      version:
        description: 'Version (1.2.3); required when publish is checked from a manual run'
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Version
        id: version
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; fi
          if [ -z "$v" ]; then v="0.0.0-dev"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v"

      - name: Cross-compile
        run: |
          mkdir -p dist
          build() {
            goos=$1 goarch=$2 goarm=${3:-} ext=${4:-}
            name="openflux-$goos-$goarch$ext"
            echo "building $name"
            GOOS=$goos GOARCH=$goarch GOARM=$goarm CGO_ENABLED=0 GOFLAGS=-buildvcs=false \
              go build -trimpath -ldflags "-s -w" -o "dist/$name" .
          }
          build linux   amd64
          build linux   arm64
          build linux   arm   7
          build windows 386   "" .exe
          build windows amd64 "" .exe
          build windows arm64 "" .exe
          build darwin  amd64
          build darwin  arm64
          # The subscription service (docs/subscriptions.ru.md) runs on a Linux server.
          for arch in amd64 arm64; do
            echo "building opensub-linux-$arch"
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 GOFLAGS=-buildvcs=false \
              go build -trimpath -ldflags "-s -w" -o "dist/opensub-linux-$arch" ./cmd/opensub
          done
          cd dist && sha256sum openflux-* opensub-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openflux-${{ steps.version.outputs.value }}
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.publish && inputs.version != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="${GITHUB_REF#refs/tags/}"
          else tag="v${{ inputs.version }}"; fi
          # The release shows its CHANGELOG.md section, then what the assets are.
          awk -v v="${tag#v}" 'index($0, "## [")==1 { if (f) exit; f = (index($0, "## [" v "]") == 1); next } f' CHANGELOG.md > notes.md
          printf '\n%s\n' "Кросс-платформенная сборка CLI (клиент/выходная нода): \`openflux-<os>-<arch>[.exe]\`. Сервис подписок: \`opensub-linux-<arch>\` (см. docs/subscriptions.ru.md). Контрольные суммы — в \`SHA256SUMS.txt\`. Для установки выходной ноды по SSH из приложения используется отдельный релиз \`node-v*\` (см. deploy/node-install.sh)." >> notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            # The tag was moved to rebuild an existing release: replace its
            # assets and refresh the notes instead of failing on create.
            generated=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$tag" --jq .body)
            printf '\n%s\n' "$generated" >> notes.md
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "OpenFlux $tag" --notes-file notes.md
          else
            gh release create "$tag" dist/* \
              --title "OpenFlux $tag" \
              --generate-notes \
              --notes-file notes.md
          fi
