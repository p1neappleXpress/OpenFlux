# yandexpic — клиент. SOCKS5 на 127.0.0.1:19181, трафик уходит PNG-чанками
# в Яндекс.Картинки, cbirId — через комнаты cups.
#
#   OPENFLUX_POINTER_ROOMS='<список комнат>' \
#   OPENFLUX_CBIR_CHUNK=196608 OPENFLUX_CBIR_UPLOADS=32 \
#   ./ofx --config=deploy/yandexpic-client.conf --role=client \
#       --negotiate --session-context=openflux_ \
#       --encryption-key-file=key.hex --cookie-file=/root/yandexpic/cookies-client.json
#
# ВАЖНО: cookie-файл должен отличаться от серверного.

Mode = l4
Inbound = socks5
Socks5 = 127.0.0.1:19181

[Transport yandexpic]
Type = yandexpic
Priority = 100

[Transport cupsonline]
Type = cupsonline
Priority = 70
