# yandexpic — выход (сервер). Данные идут PNG-чанками в Яндекс.Картинки,
# cbirId и служебное — через комнаты cups.
#
# Запуск (обязательно свой cookie-файл, иначе релей считает стороны одним
# пользователем и не релеит между ними):
#
#   OPENFLUX_POINTER_ROOMS='<список комнат>' \
#   OPENFLUX_CBIR_CHUNK=196608 OPENFLUX_CBIR_UPLOADS=32 \
#   ./ofx --config=deploy/yandexpic-server.conf --role=exit \
#       --negotiate --session-context=openflux_ \
#       --encryption-key-file=key.hex --cookie-file=/root/yandexpic/cookies-server.json
#
# Без OPENFLUX_POINTER_ROOMS выход создаст комнаты сам и напечатает список
# («COPY THIS TO CLIENT»).

Mode = l4

[Transport yandexpic]
Type = yandexpic
Priority = 100

[Transport cupsonline]
Type = cupsonline
Priority = 70
